name: Deploy Pages and refresh OpenAQ every 6 hours
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Retrieve previous published snapshot for partial-upstream-failure fallback
        env:
          SNAPSHOT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/air-quality.json
        run: |
          mkdir -p public/data
          if curl --fail --silent --show-error --max-time 30 "$SNAPSHOT_URL" -o /tmp/previous-snapshot.json; then
            node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/previous-snapshot.json')); if(!Array.isArray(d.cities)) process.exit(1)"
            cp /tmp/previous-snapshot.json public/data/air-quality.json
          fi
      - name: Refresh all city readings and hourly histories
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: npm run refresh:data
      - run: npm run validate:data
      - name: Build static site and scan for credential leaks
        env:
          GH_PAGES_BASE: ${{ github.event.repository.name }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: npm run export
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
      - name: Wait for Pages artifact metadata to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for attempt in $(seq 1 18); do
            count=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo 'Pages artifact metadata did not become available in time.'
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
